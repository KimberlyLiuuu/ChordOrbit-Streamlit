<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <title>和弦星圖 · Chord Orbit</title>
  <meta name="description" content="點擊和弦圓圈，聆聽和弦並查看分解音。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080b13'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%237ce8e1' stroke-width='4'/%3E%3Cpath d='M25 39V19l18-4v20' fill='none' stroke='%23ff78b7' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='42' r='7' fill='%23ff78b7'/%3E%3Ccircle cx='38' cy='37' r='7' fill='%23ff78b7'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#080b13;--panel:#101622;--line:#263142;--ink:#f5f7fb;--muted:#94a1b5;--major:#ff70b1;--minor:#66d7f4;--mint:#b7fae5;--active:#ffe98b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 46% 30%,#182331 0,#0c111b 48%,#070910 100%);color:var(--ink);font-family:Inter,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 370px}
    .map-wrap{position:relative;min-height:100vh;overflow:hidden;padding:24px}.brand{position:absolute;z-index:3;left:32px;top:28px}.brand strong{display:block;font-size:1.2rem;letter-spacing:.08em}.brand span{font-size:.82rem;color:var(--muted)}
    .legend{position:absolute;z-index:3;left:32px;bottom:28px;display:flex;gap:18px;color:var(--muted);font-size:.8rem}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}.dot.major{background:var(--major)}.dot.minor{background:var(--minor)}
    #orbit{width:100%;height:calc(100vh - 48px);display:block}.ring{fill:none;stroke:#ffffff0b;stroke-width:1}.spoke{stroke:var(--mint);stroke-opacity:.22;stroke-width:1}.node{cursor:pointer;outline:none}.node circle{fill:#121c29;stroke-width:2;transition:.18s ease}.node.major circle{stroke:var(--major)}.node.minor circle{stroke:var(--minor)}.node text{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node:hover circle,.node:focus-visible circle{fill:#243345;stroke-width:4}.node.selected circle{fill:#342d1f;stroke:var(--active);stroke-width:4;filter:drop-shadow(0 0 8px #ffe98b66)}
    .panel{background:#0d121ccc;border-left:1px solid #ffffff12;backdrop-filter:blur(18px);padding:28px 26px;display:flex;flex-direction:column;gap:23px;min-height:100vh}.eyebrow{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.16em}.chord-title{font-family:Georgia,serif;font-size:4.3rem;line-height:.92;margin:7px 0 12px}.quality{color:var(--major);font-weight:700}.note-row{display:flex;gap:10px}.note-pill{height:48px;min-width:48px;padding:0 12px;border:1px solid #ffffff20;border-radius:14px;display:grid;place-items:center;background:#ffffff08;font-weight:800;font-size:1.1rem}.sequence{padding:17px 18px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff05}.sequence-label{font-size:.75rem;color:var(--muted);margin-bottom:10px}.sequence-notes{font-size:1.08rem;font-weight:700;letter-spacing:.07em}.now{color:var(--active)}
    .piano{height:112px;display:flex;position:relative;padding-top:4px}.key{flex:1;border:1px solid #252b36;background:#f1f2f4;border-radius:0 0 7px 7px;position:relative}.key.active{background:#ffe26e;box-shadow:0 0 20px #ffe26e55 inset}.key.black{position:absolute;z-index:2;width:8.2%;height:66%;background:#171b22;border-color:#05070a;border-radius:0 0 5px 5px;transform:translateX(-50%)}.key.black.active{background:#ff70b1}.key[data-n="C#"]{left:14.28%}.key[data-n="D#"]{left:28.56%}.key[data-n="F#"]{left:57.12%}.key[data-n="G#"]{left:71.4%}.key[data-n="A#"]{left:85.68%}
    .controls{display:grid;gap:12px}.play-row{display:grid;grid-template-columns:1fr 54px;gap:10px}.primary,.icon-btn{border:0;border-radius:14px;color:#101219;background:linear-gradient(135deg,#ffe98b,#ff9dcb);font-weight:850;cursor:pointer;min-height:50px}.icon-btn{font-size:1.25rem;background:#232b39;color:#fff}.primary:active,.icon-btn:active{transform:translateY(1px)}.control-line{display:grid;grid-template-columns:66px 1fr 56px;align-items:center;gap:10px;color:var(--muted);font-size:.82rem}.control-line output{color:var(--ink);text-align:right}.control-line select{background:#171f2b;color:var(--ink);border:1px solid #ffffff17;border-radius:9px;padding:7px}.hint{margin-top:auto;color:var(--muted);font-size:.8rem;line-height:1.55;border-top:1px solid #ffffff12;padding-top:16px}kbd{border:1px solid #ffffff24;border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:#ffffff08;color:var(--ink)}
    @media(max-width:820px){.app{grid-template-columns:1fr}.map-wrap{min-height:auto;padding:12px}.brand{left:20px;top:18px}.legend{display:none}#orbit{height:58vh;min-height:470px}.panel{min-height:auto;border-left:0;border-top:1px solid #ffffff12;padding:24px}.chord-title{font-size:3.6rem}.hint{margin-top:8px}}
  </style>
</head>
<body><main class="app">
  <section class="map-wrap" aria-label="和弦關係圖">
    <header class="brand"><strong>和弦星圖</strong><span>CHORD ORBIT</span></header>
    <svg id="orbit" viewBox="0 0 760 760" role="group" aria-label="可點擊的大小三和弦圓圈"></svg>
    <div class="legend"><span><i class="dot major"></i>大三和弦</span><span><i class="dot minor"></i>小三和弦</span></div>
  </section>
  <aside class="panel" aria-live="polite">
    <div><div class="eyebrow">目前和弦</div><div class="chord-title" id="chordName">C</div><div class="quality" id="quality">C 大三和弦</div></div>
    <div class="note-row" id="noteRow"></div>
    <div class="piano" id="piano" aria-label="和弦鋼琴鍵位"></div>
    <div class="sequence"><div class="sequence-label">分解音 · ARPEGGIO</div><div class="sequence-notes" id="sequence"></div></div>
    <div class="controls">
      <div class="play-row"><button class="primary" id="play">▶ 播放分解和弦</button><button class="icon-btn" id="stop" aria-label="停止播放">■</button></div>
      <label class="control-line"><span>速度</span><input id="tempo" type="range" min="50" max="180" value="96"><output id="tempoOut">96</output></label>
      <label class="control-line"><span>八度</span><select id="octave"><option value="3">低音 · 3</option><option value="4" selected>中央 · 4</option><option value="5">高音 · 5</option></select><output></output></label>
      <label class="control-line"><span>走向</span><select id="direction"><option value="up">上行</option><option value="down">下行</option><option value="both" selected>上下行</option></select><output></output></label>
    </div>
    <p class="hint">點擊左邊任意圓圈，會先響一次完整和弦，再播放分解音。也可按 <kbd>Space</kbd> 重播。</p>
  </aside>
</main>
<script>
const names=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];
const pitch={C:0,'C♯':1,'D♭':1,D:2,'D♯':3,'E♭':3,E:4,F:5,'F♯':6,'G♭':6,G:7,'G♯':8,'A♭':8,A:9,'A♯':10,'B♭':10,B:11};
const spellSharp=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const flatRoots=new Set(['D♭','A♭','E♭','B♭','F']);
const spellFlat=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
let selected={root:'C',minor:false}, ctx, timers=[];
const svg=document.querySelector('#orbit'), NS='http://www.w3.org/2000/svg';
function el(tag,attrs={}){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
[286,218].forEach(r=>svg.append(el('circle',{cx:380,cy:380,r,class:'ring'})));
names.forEach((root,i)=>{const a=(i/12)*Math.PI*2-Math.PI/2;const mx=380+286*Math.cos(a),my=380+286*Math.sin(a),ix=380+218*Math.cos(a),iy=380+218*Math.sin(a);svg.append(el('line',{x1:ix,y1:iy,x2:mx,y2:my,class:'spoke'}));addNode(root,false,mx,my);const rel=(pitch[root]+9)%12;const relName=(flatRoots.has(root)?spellFlat:spellSharp)[rel]+'m';addNode(relName,true,ix,iy)});
function addNode(label,minor,x,y){const g=el('g',{class:`node ${minor?'minor':'major'}`,tabindex:'0',role:'button','aria-label':`${label}和弦`});g.dataset.root=label.replace('m','');g.dataset.minor=minor;g.append(el('circle',{cx:x,cy:y,r:minor?24:26}));const t=el('text',{x,y});t.textContent=label;g.append(t);g.addEventListener('click',()=>select(g,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(g,true)}});svg.append(g)}
function chordNotes(root,minor){const p=pitch[root], ints=minor?[0,3,7]:[0,4,7],sp=flatRoots.has(root)?spellFlat:spellSharp;return ints.map(i=>sp[(p+i)%12])}
function select(node,audio){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');selected={root:node.dataset.root,minor:node.dataset.minor==='true'};render();if(audio){playChord();setTimeout(playArp,650)}}
function render(){const notes=chordNotes(selected.root,selected.minor);document.querySelector('#chordName').textContent=selected.root+(selected.minor?'m':'');const q=document.querySelector('#quality');q.textContent=`${selected.root} ${selected.minor?'小':'大'}三和弦`;q.style.color=selected.minor?'var(--minor)':'var(--major)';document.querySelector('#noteRow').innerHTML=notes.map(n=>`<span class="note-pill">${n}</span>`).join('');const dir=document.querySelector('#direction').value;let seq=dir==='down'?[...notes].reverse():dir==='both'?[...notes,notes[1],notes[0]]:notes;document.querySelector('#sequence').innerHTML=seq.map((n,i)=>`<span data-i="${i}">${n}</span>`).join(' · ');renderPiano(notes)}
function renderPiano(notes){const naturals=['C','D','E','F','G','A','B'];const piano=document.querySelector('#piano');piano.innerHTML=naturals.map(n=>`<span class="key" data-n="${n}"></span>`).join('')+['C#','D#','F#','G#','A#'].map(n=>`<span class="key black" data-n="${n}"></span>`).join('');const pcs=notes.map(n=>pitch[n]);piano.querySelectorAll('.key').forEach(k=>{const kn=pitch[k.dataset.n.replace('#','♯')];if(pcs.includes(kn))k.classList.add('active')})}
function audioCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function freq(note,oct){const midi=12*(oct+1)+pitch[note];return 440*Math.pow(2,(midi-69)/12)}
function tone(note,oct,when,dur=.7,vol=.18){const c=audioCtx(),o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),filter=c.createBiquadFilter();o.type='triangle';o2.type='sine';o.frequency.value=freq(note,oct);o2.frequency.value=freq(note,oct)*2;filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(filter);o2.connect(filter);filter.connect(g).connect(c.destination);o.start(when);o2.start(when);o.stop(when+dur+.03);o2.stop(when+dur+.03)}
function stop(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('#sequence span').forEach(s=>s.classList.remove('now'));if(ctx){ctx.close();ctx=null}}
function playChord(){stop();const notes=chordNotes(selected.root,selected.minor),oct=+document.querySelector('#octave').value,c=audioCtx(),t=c.currentTime+.03;notes.forEach((n,i)=>tone(n,oct+(pitch[n]<pitch[selected.root]?1:0),t,1,.11))}
function playArp(){stop();const notes=chordNotes(selected.root,selected.minor),dir=document.querySelector('#direction').value,oct=+document.querySelector('#octave').value,bpm=+document.querySelector('#tempo').value,step=60/bpm;let seq=dir==='down'?[...notes].reverse():dir==='both'?[...notes,notes[1],notes[0]]:[...notes];const c=audioCtx(),t=c.currentTime+.08;seq.forEach((n,i)=>{tone(n,oct+(pitch[n]<pitch[selected.root]?1:0),t+i*step,step*.9,.18);timers.push(setTimeout(()=>{document.querySelectorAll('#sequence span').forEach(s=>s.classList.remove('now'));document.querySelector(`#sequence span[data-i="${i}"]`)?.classList.add('now')},(i*step+.08)*1000))});timers.push(setTimeout(()=>document.querySelectorAll('#sequence span').forEach(s=>s.classList.remove('now')),(seq.length*step+.2)*1000))}
document.querySelector('#play').onclick=playArp;document.querySelector('#stop').onclick=stop;document.querySelector('#tempo').oninput=e=>document.querySelector('#tempoOut').textContent=e.target.value;document.querySelector('#direction').onchange=render;document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();playArp()}});
select([...document.querySelectorAll('.node')].find(n=>n.dataset.root==='C'&&n.dataset.minor==='false'),false);
</script></body></html>
